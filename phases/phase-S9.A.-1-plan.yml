# ──────────────────────────────────────────────────────────────────────
# Substories
# ──────────────────────────────────────────────────────────────────────
substories:

  - id: S9.A.-1.0
    title: "Grammar-pick spike — TOML + YAML crate selection + API verification"
    type: spike
    module: "(no production code — fills spike_notes only)"
    rationale: >
      Resolves R-S9.A.-1-1, R-S9.A.-1-2, R-S9.A.-1-3 before any RED test
      pins a crate-version choice into a Cargo.toml diff. The spike's
      output is the pinned crate identifiers that S9.A.-1.2 and S9.A.-1.4
      reference. Skipping or compressing the spike risks committing a
      crate version that fails to build on a colleague's machine after the
      RED is already pushed.
    design_notes:
      - "Survey candidate crates on crates.io for both tree-sitter-toml and tree-sitter-yaml. Compare: last published date, stated tree-sitter version compat, exported `LANGUAGE` const presence, repo activity."
      - "For each finalist, add as a workspace dep in a scratch branch and confirm `cargo build -p aq-treesitter --no-default-features` succeeds with a trivial `let _ = tree_sitter_<lang>::LANGUAGE.into();` reference."
      - "If a finalist requires the legacy `language()` fn, escalate per R-S9.A.-1-3; do NOT add a wrapper without sign-off."
      - "Fill spike_notes.toml_pick, spike_notes.yaml_pick, spike_notes.api_compat_confirmed."
      - "Estimate: 30-60 minutes; output is notes only, no code change committed."
    red_tests: []
    green_impl: []
    loc_budget: 0
    commit_pair:
      spike: "percept: S9.A.-1.0 spike — pin tree-sitter-toml + tree-sitter-yaml crate versions"

  - id: S9.A.-1.1
    title: "RED — TOML grammar integration tests + fixture"
    type: red
    module: "crates/aq-treesitter/tests/integration.rs, crates/aq-treesitter/tests/fixtures/toml/Cargo.sample.toml"
    rationale: >
      Tests pin the public-API contract for the new TOML grammar before any
      Cargo.toml or langs.rs change exists. Mirror the Dart/Swift integration
      shape already present in tests/integration.rs (verified 2026-05-21).
    design_notes:
      - "Create crates/aq-treesitter/tests/fixtures/toml/Cargo.sample.toml — synthetic minimal Cargo.toml-shape: a [package] table with name + version; a [dependencies] table with `tree-sitter = \"0.25\"`; a [features] table with `default = [\"semantic\"]` and `semantic = []`."
      - "Add a `#[test] fn toml_*` block in tests/integration.rs (do not move existing tests; append). Use `include_str!` for the fixture, `Language::from_extension(\"toml\")` for the language lookup, `ParsedTree::parse(src, lang)` for parsing."
      - "Each test is independent — no shared mutable state. Match existing tests' style (no helper indirection unless trivially obvious)."
      - "All six tests MUST fail on `cargo test -p aq-treesitter` before the GREEN commit — verify with `cargo test -p aq-treesitter --quiet 2>&1 | grep 'FAILED' | wc -l` >= 6 OR a compile failure on `Language::Toml` reference."
    red_tests:
      - name: toml_parses_without_error_nodes
        intent: "ParsedTree::parse(fixture, Language::Toml) -> Ok; resulting tree has no ERROR nodes when walked via to_owned_node()."
      - name: toml_find_top_level_keys
        intent: "Walking the parsed tree surfaces table node names that include `package`, `dependencies`, and `features` (or whatever the grammar's actual node types are — spike updates expected names if needed)."
      - name: toml_find_specific_key
        intent: "Querying for the `semantic` key inside the [features] table returns a non-empty result set."
      - name: toml_find_dep_by_name
        intent: "Querying for the `tree-sitter` key inside the [dependencies] table returns a non-empty result set."
      - name: toml_from_extension_returns_toml
        intent: "Language::from_extension(\"toml\") == Some(Language::Toml)."
      - name: toml_in_supported_languages
        intent: "backend::supported_languages() slice contains the literal string \"toml\"."
    green_impl: []
    loc_budget: 120
    commit_pair:
      red: "percept: S9.A.-1.1 RED — TOML grammar integration tests + fixture (6 RED)"

  - id: S9.A.-1.2
    title: "GREEN — TOML grammar wired through 5 touchpoints"
    type: green
    module:
      - "Cargo.toml (workspace)"
      - "crates/aq-treesitter/Cargo.toml"
      - "crates/aq-treesitter/src/langs.rs"
      - "crates/aq-treesitter/src/backend.rs"
    rationale: >
      Minimum implementation to pass S9.A.-1.1. No new tests added during
      GREEN; no scope creep into cfg-gating.
    design_notes:
      - "Workspace Cargo.toml: add `tree-sitter-toml = \"<pin from spike_notes.toml_pick>\"` to [workspace.dependencies]."
      - "crates/aq-treesitter/Cargo.toml: add `tree-sitter-toml = { workspace = true, optional = true }` to [dependencies]; add `toml = [\"dep:tree-sitter-toml\"]` to [features]; append `\"toml\"` to the `default = [...]` array. (Match the optional/feature shape used by existing grammars — verify via inspection during GREEN; if existing grammars are unconditional rather than dep:-gated, drop the optional + dep: forms and match precedent exactly. D-S9.A.-1-2 forbids divergence.)"
      - "langs.rs: add `Toml` variant to `Language` enum; add `\"toml\" => Some(Language::Toml)` arm to `from_extension`; add `\"toml\" => Some(Language::Toml)` arm to `from_name`; add `Language::Toml => tree_sitter_toml::LANGUAGE.into()` arm to `ts_language`; add `Language::Toml => \"toml\"` arm to `name`."
      - "backend.rs: insert `\"toml\"` into the alphabetical literal-string slice in `supported_languages()` (insertion point: after `\"swift\"`)."
      - "Run `cargo fmt --all` and `cargo clippy --workspace --exclude mq-embed --exclude mq-store --exclude mq-cli -- -D warnings` before committing — workspace exclusions per /memories/percept-conventions.md."
    red_tests: []
    loc_budget: 30
    commit_pair:
      green: "percept: S9.A.-1.2 GREEN — TOML grammar wired through 5 touchpoints"

  - id: S9.A.-1.3
    title: "RED — YAML grammar integration tests + fixture"
    type: red
    module: "crates/aq-treesitter/tests/integration.rs, crates/aq-treesitter/tests/fixtures/yaml/pubspec.sample.yaml"
    rationale: >
      Same shape as S9.A.-1.1 but for YAML, plus an extra test for the
      .yml vs .yaml dual-extension routing (D-S9.A.-1-5). Pubspec-shaped
      fixture matches canopy S9.A's primary YAML use case.
    design_notes:
      - "Create crates/aq-treesitter/tests/fixtures/yaml/pubspec.sample.yaml — synthetic pubspec.yaml shape: `name: sample_app`, `version: 0.1.0`, `dependencies:` with `flutter:` nested mapping containing `sdk: flutter`, `dev_dependencies:` with `flutter_test:` containing `sdk: flutter`, and a top-level `dependency_overrides:` left empty for the negative-existence test."
      - "Tests use `Language::from_extension(\"yaml\")` for one test, `Language::from_extension(\"yml\")` for another — both must resolve to Language::Yaml."
      - "Parser tests walk the OwnedNode tree and assert on block_mapping_pair / block_sequence_item node types (or whatever the chosen grammar actually emits — spike updates expected names if needed)."
    red_tests:
      - name: yaml_parses_without_error_nodes
        intent: "ParsedTree::parse(fixture, Language::Yaml) -> Ok; no ERROR nodes in walked tree."
      - name: yaml_find_top_level_keys
        intent: "Walking the parsed tree surfaces top-level key nodes whose text includes `name`, `version`, `dependencies`, `dev_dependencies`."
      - name: yaml_find_nested_key
        intent: "Querying for `flutter` under `dependencies` returns a non-empty result set (nested-mapping lookup)."
      - name: yaml_find_list_items
        intent: "If the fixture contains a list (add one minimal list to a `dev_dependencies` analog if needed, e.g. `topics: [example, sample]`), the list's items are walkable as block_sequence_item or flow_node nodes."
      - name: yaml_from_extension_yml_returns_yaml
        intent: "Language::from_extension(\"yml\") == Some(Language::Yaml)."
      - name: yaml_from_extension_yaml_returns_yaml
        intent: "Language::from_extension(\"yaml\") == Some(Language::Yaml)."
      - name: yaml_in_supported_languages
        intent: "backend::supported_languages() slice contains the literal string \"yaml\"."
    green_impl: []
    loc_budget: 140
    commit_pair:
      red: "percept: S9.A.-1.3 RED — YAML grammar integration tests + fixture (7 RED)"

  - id: S9.A.-1.4
    title: "GREEN — YAML grammar wired through 5 touchpoints (dual-extension)"
    type: green
    module:
      - "Cargo.toml (workspace)"
      - "crates/aq-treesitter/Cargo.toml"
      - "crates/aq-treesitter/src/langs.rs"
      - "crates/aq-treesitter/src/backend.rs"
    rationale: >
      Minimum implementation to pass S9.A.-1.3. Mirrors S9.A.-1.2 with the
      dual-extension twist: from_extension matches BOTH \"yml\" and \"yaml\"
      (precedent: javascript matches js/mjs/cjs/jsx).
    design_notes:
      - "Workspace Cargo.toml: add `tree-sitter-yaml = \"<pin from spike_notes.yaml_pick>\"` to [workspace.dependencies]."
      - "crates/aq-treesitter/Cargo.toml: add dep entry matching the pattern chosen in S9.A.-1.2 (optional+dep: gated, or unconditional — keep symmetric with TOML); add `yaml = [\"dep:tree-sitter-yaml\"]` (or equivalent) to [features]; append `\"yaml\"` to `default = [...]`."
      - "langs.rs: add `Yaml` variant to `Language`; from_extension match arm `\"yml\" | \"yaml\" => Some(Language::Yaml)` (single arm, two patterns); from_name `\"yaml\" => Some(Language::Yaml)`; ts_language `Language::Yaml => tree_sitter_yaml::LANGUAGE.into()`; name `Language::Yaml => \"yaml\"`."
      - "backend.rs: insert `\"yaml\"` alphabetically (insertion point: after `\"typescript\"` if typescript precedes yaml alphabetically — verify and place accordingly)."
      - "Run `cargo fmt --all` and the workspace clippy (with mq-embed/mq-store/mq-cli excluded) before committing."
    red_tests: []
    loc_budget: 30
    commit_pair:
      green: "percept: S9.A.-1.4 GREEN — YAML grammar wired (dual-extension yml/yaml)"

# ──────────────────────────────────────────────────────────────────────
# Follow-ups (created when sprint closes; not part of S9.A.-1 scope)
# ──────────────────────────────────────────────────────────────────────
follow_ups:
  - id: FU-S9.A.-1-1
    title: "Add real #[cfg(feature = \"X\")] gates to all 14 grammar arms in langs.rs"
    rationale: >
      The inert-feature-flag pattern was extended (not fixed) by this sprint
      per D-S9.A.-1-2. Real cfg gates would let canopy build with
      `default-features = false, features = [\"toml\", \"yaml\"]` and skip
      the rust/js/ts/dart compile cost — a meaningful win for canopy's
      footprint. Refactor across all 14 grammars in a single sprint.
    blocking_for: "canopy footprint optimization; not blocking ADR-028 Phase 9.B+"

  - id: FU-S9.A.-1-2
    title: "First crates.io publish for aq-core + aq-treesitter (ADR-028 D7.A precursor)"
    rationale: >
      Canopy consumes percept via path-dep today. Per ADR-028 D7.A, the
      eventual posture is percept publishes to crates.io and canopy depends
      on published versions. Pre-flight: bump versions, verify metadata
      (license, repository, description), publish aq-core first, then
      aq-treesitter, then bump canopy's Cargo.toml to use crates.io versions.
    blocking_for: "ADR-028 D7.A activation"

# ──────────────────────────────────────────────────────────────────────
# Sprint-close acceptance (run all in order; non-zero exit blocks close)
# ──────────────────────────────────────────────────────────────────────
sprint_close_acceptance:
  description: |
    Conductor extracts each `$` line and runs it. All must exit 0 for
    S9.A.-1 to ship. If `aq --skeleton` rejects the new extensions,
    Q-S9.A.-1-1 escalates to a sprintlet S9.A.-1.2a / S9.A.-1.4a before
    the sprint closes.
  commands: |
    $ cd /Users/develop/local-stacks/percept
    $ cargo fmt --all -- --check
    $ cargo clippy --workspace --exclude mq-embed --exclude mq-store --exclude mq-cli -- -D warnings
    $ cargo test -p aq-treesitter --quiet
    $ cargo test --workspace --exclude mq-embed --exclude mq-store --exclude mq-cli --quiet
    $ cargo run --quiet --bin aq -- --skeleton crates/aq-treesitter/tests/fixtures/toml/Cargo.sample.toml | jq -e '.language == "toml"'
    $ echo 'name: test' > /tmp/s9a-1-smoke.yaml && cargo run --quiet --bin aq -- --skeleton /tmp/s9a-1-smoke.yaml | jq -e '.language == "yaml"'
    $ echo 'name: test' > /tmp/s9a-1-smoke.yml && cargo run --quiet --bin aq -- --skeleton /tmp/s9a-1-smoke.yml | jq -e '.language == "yaml"'
  verdict_logic: |
    All commands must exit 0. If the three `aq --skeleton` smokes fail
    with "unsupported extension" or empty `.language`, GREEN substories
    are incomplete (the grammar is reachable from the library but not
    from the binary). Investigate Q-S9.A.-1-1 resolution.
  notes: |
    Workspace-exclude flags (mq-embed, mq-store, mq-cli) are mandatory
    per /memories/percept-conventions.md — those crates have known build
    or lint failures unrelated to this sprint. Including them turns the
    acceptance block red on unrelated issues.
