sprint: S9.A.-1
phase: "S9.A.-1 (percept-side prerequisite to canopy Phase 9.A)"
title: "Add tree-sitter-toml + tree-sitter-yaml grammars to aq-treesitter"
status: planned
authored: 2026-05-21
upstream_plan: "../canopy/phases/phase-9-S9.A-plan.yml (canopy S9.A)"
adr_refs:
  - "ADR-028 §Prerequisites (Path A amendment, 2026-05-21) — names this sprint explicitly"
  - "ADR-028 D4/D5 Path A — aq_path predicate routes by file extension via aq-treesitter; .toml and .yaml currently return None"
  - "ADR-028 D1 — in-process evaluation invariant; grammars must be reachable from aq-core without shell-out"
  - "ADR-028 D7.A — crates.io publish deferred; canopy stays path-dep"

# ──────────────────────────────────────────────────────────────────────
# Scope summary
# ──────────────────────────────────────────────────────────────────────
scope:
  in_scope:
    - "Add tree-sitter-toml grammar to aq-treesitter (5-touchpoint pattern)"
    - "Add tree-sitter-yaml grammar to aq-treesitter (5-touchpoint pattern, dual-extension .yml/.yaml)"
    - "Integration tests against real fixtures (Cargo.toml + pubspec.yaml)"
    - "Workspace + crate Cargo.toml dependency + feature wiring"
    - "backend.rs supported_languages() alphabetical insertion"
  out_of_scope:
    - "cfg-gating the existing inert feature flags across all 12+ grammars (see FU-S9.A.-1-1)"
    - "Canopy-side aq_path predicate wiring (lives in canopy S9.A.1+)"
    - "First crates.io publish of aq-core + aq-treesitter (see FU-S9.A.-1-2; ADR-028 D7.A)"
    - "TOML/YAML being added to canopy's substrate classifier (canopy-side concern)"
    - "aq --skeleton per-grammar query files unless the generic walker fails (see Q-S9.A.-1-1)"
    - "Cargo.lock routing — .lock is a different extension, not in v1 (see Q-S9.A.-1-2)"

# ──────────────────────────────────────────────────────────────────────
# Existing convention reference (verified against current main 2026-05-21)
# ──────────────────────────────────────────────────────────────────────
existing_grammars:
  count: 12
  list:
    - rust
    - javascript
    - typescript
    - python
    - json
    - go
    - java
    - c
    - cpp
    - dart
    - swift
  api_invariant: |
    All existing grammars use the tree-sitter 0.25 `LANGUAGE` const API:
      use tree_sitter_<lang>::LANGUAGE;
      LANGUAGE.into()
    No grammar uses the legacy `language()` fn. R-S9.A.-1-3 escalation
    trigger: any candidate crate that does not expose `LANGUAGE` const
    requires a scope-expansion decision before silent abstraction.
  five_touchpoint_pattern:
    - "workspace Cargo.toml [workspace.dependencies] entry"
    - "crates/aq-treesitter/Cargo.toml [dependencies] entry + [features] entry + addition to default feature list"
    - "langs.rs: Language enum variant"
    - "langs.rs: from_extension match arm"
    - "langs.rs: from_name match arm + ts_language match arm + name match arm"
  backend_touchpoint:
    file: "crates/aq-treesitter/src/backend.rs"
    detail: "supported_languages() literal-string slice; insertion stays alphabetical"
  inert_feature_pattern: |
    Existing features (rust, javascript, ...) are declared in Cargo.toml and
    listed in `default`, but langs.rs does NOT gate variants with
    `#[cfg(feature = "X")]`. Adding cfg gates is a cross-cutting refactor
    across all 14 grammars — explicitly deferred to FU-S9.A.-1-1.
    S9.A.-1 matches the existing inert pattern for consistency.

loc_budget: 380     # production ~120, tests + fixtures ~260
total_red_tests: 13 # 6 TOML + 7 YAML

# ──────────────────────────────────────────────────────────────────────
# Decisions (resolved before RED)
# ──────────────────────────────────────────────────────────────────────
decisions:
  - id: D-S9.A.-1-1
    question: "Which grammars are in scope, and in what order?"
    answer: >
      Two grammars: TOML first (smaller surface, single .toml extension),
      YAML second (dual-extension .yml/.yaml, larger fixture surface, more
      community-fork variance). Order keeps risk loaded into the second half
      of the sprint, where the spike has already validated the API path.
    rationale: >
      ADR-028 §Prerequisites names exactly TOML + YAML. The canopy
      use cases are Cargo.toml + pubspec.yaml. No other formats are
      blocking S9.A.

  - id: D-S9.A.-1-2
    question: "Do new grammars get real #[cfg(feature = X)] gating?"
    answer: >
      No. Match the existing inert-feature-flag pattern: declare `toml` and
      `yaml` features in crates/aq-treesitter/Cargo.toml and add them to the
      `default` feature list, but do NOT add `#[cfg(feature = "toml")]` /
      `#[cfg(feature = "yaml")]` attributes to langs.rs match arms.
    rationale: >
      All 12 existing grammars are inert-flagged. Adding real cfg gates for
      only the 2 new grammars creates asymmetry that confuses readers and
      makes a default-features=false build behave inconsistently. The full
      cfg cross-cut is FU-S9.A.-1-1; do it for all 14 grammars at once or
      not at all.

  - id: D-S9.A.-1-3
    question: "What fixtures do the integration tests use?"
    answer: >
      Real-world config files where practical:
        - TOML: synthetic minimal Cargo.toml-shaped fixture under
          crates/aq-treesitter/tests/fixtures/toml/Cargo.sample.toml. A
          checked-in fixture is preferred over reading crates/aq-treesitter/
          Cargo.toml at test time because that file's contents change as
          this sprint itself modifies it — tests would become flaky.
        - YAML: synthetic minimal pubspec.yaml-shaped fixture under
          crates/aq-treesitter/tests/fixtures/yaml/pubspec.sample.yaml.
          Mirrors a canonical Flutter pubspec structure (name, version,
          dependencies.flutter.sdk, dev_dependencies).
    rationale: >
      Synthetic but real-world-shaped fixtures keep tests deterministic
      while reflecting what canopy aq_path will actually be asked to parse.
      Avoids the self-referential flakiness of "test reads the file the
      test edits".

  - id: D-S9.A.-1-4
    question: "Where in backend.rs supported_languages() do new entries land?"
    answer: >
      Alphabetical order across the entire list. Insertion points:
        - "toml" after "swift"
        - "yaml" after "toml" (i.e. final position assuming current list ends
          at "typescript" — actual position will be alphabetical against the
          existing list, which contains "typescript" > "toml"). Verify the
          actual sort during GREEN; do not assume.
    rationale: >
      Backend.rs convention is alphabetical (verified by inspection 2026-05-21).
      Preserving alphabetical ordering keeps diffs minimal and avoids editor
      churn for downstream consumers.

  - id: D-S9.A.-1-5
    question: "How are .yml and .yaml routed?"
    answer: >
      Both extensions map to Language::Yaml in from_extension. Mirrors the
      existing precedent for JavaScript (js/mjs/cjs/jsx all -> Language::Javascript)
      and TypeScript (ts/tsx -> Language::Typescript). Single grammar,
      multiple extensions; no separate enum variant.
    rationale: >
      .yml and .yaml are interchangeable per the YAML spec. Splitting them
      across two enum variants would force downstream code to handle both
      identically — pure noise.

  - id: D-S9.A.-1-6
    question: "Does this sprint modify aq-core's public API?"
    answer: >
      No. aq-treesitter exposes new variants on Language enum; callers
      already use Language::from_path / Language::from_extension and
      ParsedTree::parse, both of which transparently accept new variants.
      aq-core's eval is grammar-agnostic and unchanged.
    rationale: >
      Keeps the sprint genuinely additive — no semver-relevant churn on the
      consuming side. Canopy's S9.A.4 GREEN consumes the new grammars
      through the existing API.

  - id: D-S9.A.-1-7
    question: "Does this sprint publish anything to crates.io?"
    answer: >
      No. Canopy continues to consume percept via path-dep. The first
      crates.io publish is ADR-028 D7.A's separate sprint (tracked here as
      FU-S9.A.-1-2). No version bumps to aq-core or aq-treesitter beyond
      what's minimally required to land the dependency additions.
    rationale: >
      Publishing aq-treesitter to crates.io before path-dep consumption is
      proven stable risks publishing churn. Defer.

# ──────────────────────────────────────────────────────────────────────
# Open questions (NOT resolved in this plan)
# ──────────────────────────────────────────────────────────────────────
open_questions:
  - id: Q-S9.A.-1-1
    question: >
      Does `aq --skeleton` need a per-grammar skeleton query file for TOML /
      YAML, or does the generic walker emit a usable skeleton?
    blocking: no
    resolve_during: S9.A.-1.2 GREEN (TOML smoke test) — first time we exercise
      the binary against a new grammar end-to-end.
    default: >
      Assume the generic walker is sufficient. If `cargo run --bin aq --
      --skeleton Cargo.sample.toml` produces an empty or panic output, scope
      expands by one sprintlet (S9.A.-1.2a) to add a minimal skeleton query
      file under whatever conventional path other grammars use. Document
      finding in spike_notes.skeleton_observations.
    impact_if_default_wrong: >
      Acceptance block's `aq --skeleton ... | jq -e '.language == "toml"'`
      check fails. Sprint blocked until skeleton query added. Cost: ~10-20
      LOC per grammar query file.

  - id: Q-S9.A.-1-2
    question: >
      Should `.toml` extension also route to Language::Toml when the file
      is named `Cargo.lock` (which uses `.lock` not `.toml`)?
    blocking: no
    resolve_during: deferred — canopy's first use case is Cargo.toml +
      pubspec.yaml. Cargo.lock is not in scope for ADR-028 v1.
    default: >
      No. `.lock` is a distinct extension. If canopy later wants Cargo.lock
      parsed, add a separate routing entry then.

# ──────────────────────────────────────────────────────────────────────
# Risks
# ──────────────────────────────────────────────────────────────────────
risks:
  - id: R-S9.A.-1-1
    title: "tree-sitter-toml fork drift / version-compat with tree-sitter 0.25"
    severity: medium
    mitigation: >
      Spike S9.A.-1.0 picks a specific crate and version, verifies it
      exposes `LANGUAGE` const (matching the existing aq-treesitter
      invariant), and pins that version in workspace Cargo.toml. Document
      the chosen crate + version + verification method in
      spike_notes.toml_pick. Candidate set (to evaluate; not pre-committed):
      `tree-sitter-toml-ng`, `tree-sitter-toml` (original ikatyang fork).

  - id: R-S9.A.-1-2
    title: "tree-sitter-yaml fork drift — community-maintained, looser TS-version compat"
    severity: medium-high
    mitigation: >
      Same approach as R-S9.A.-1-1 with higher attention. Document at
      least one fallback fork in spike_notes.yaml_pick so a regression on
      the chosen crate has a known alternative. Candidate set: `tree-sitter-
      yaml`, `tree-sitter-yaml-ng`, ikatyang fork. Verify by building
      aq-treesitter end-to-end during the spike, not by reading READMEs.

  - id: R-S9.A.-1-3
    title: "Chosen crate exposes legacy `language()` fn rather than `LANGUAGE` const"
    severity: low-medium
    mitigation: >
      ESCALATE to Phil; do NOT silently add an abstraction layer to make it
      work. If escalation results in approval to wrap, S9.A.-1.2a substory
      is added between TOML GREEN and YAML RED. Inert-feature-flag pattern
      preservation may also require a one-grammar exception, documented in
      decisions if invoked.

  - id: R-S9.A.-1-4
    title: "YAML grammar fails on .github/workflows/*.yml (multi-doc, custom anchors)"
    severity: low
    mitigation: >
      Per D-S9.A.-1-3, use a pubspec.yaml-shaped synthetic fixture rather
      than GHA workflow files. Multi-doc/anchor support is not a v1 promise
      to canopy; canopy's S9.A.4 use cases are dependency-manifest YAML
      files where the structure is simple key-map.

# ──────────────────────────────────────────────────────────────────────
# Anomalies
# ──────────────────────────────────────────────────────────────────────
anomalies:
  - id: A-S9.A.-1-1
    title: >
      Grammar may expose non-trivial query-syntax gotcha (e.g. TOML tables
      vs. inline tables, YAML flow vs. block mappings)
    handling: >
      If discovered during S9.A.-1.0 or S9.A.-1.1, document inline in
      spike_notes.toml_node_shape_note / yaml_node_shape_note. This is a
      postscript note that informs canopy S9.A's contract.yml authoring
      guide; it is NOT a sprint blocker. The aq-treesitter ParsedTree just
      needs to parse without error nodes — query-shape semantics are
      canopy's concern.

  - id: A-S9.A.-1-2
    title: "Spike may reveal that the chosen crate requires a Cargo build-script feature toggle"
    handling: >
      Some tree-sitter grammar crates ship with build-script-controlled C
      compilation paths that conflict with our default features. Document
      any such requirement in spike_notes; do NOT carry an undocumented
      build.rs side-effect into the plan's GREEN substories.

