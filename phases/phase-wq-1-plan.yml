# Follow-ups
# ──────────────────────────────────────────────────────────────────────
follow_ups: []

# ──────────────────────────────────────────────────────────────────────
# Spike notes (filled during wq-1.0 execution)
# ──────────────────────────────────────────────────────────────────────
spike_notes:
  rusqlite_pick: |
    RESOLVED 2026-07-03 (wq-1.0, informed by the earlier standalone
    vec0-poc spike — reviews/manual/wq-spikes/vec0-poc/FINDINGS.md):
    rusqlite = "0.31", features = ["bundled"]. Pinned in
    [workspace.dependencies]. Rationale: (1) rusqlite 0.40 (latest) fails
    to build on the current stable toolchain (rustc 1.94.0) — its
    libsqlite3-sys 0.38.1 build script uses the unstable cfg_select
    feature; (2) 0.31 matches canopy's existing production pin AND
    sqlite-vec 0.1.9's own dev-dependency pin, which wq-2 will need;
    (3) bundled feature for reproducible builds — no system libsqlite3
    variance across machines. load_extension feature NOT enabled (wq-2
    registers sqlite-vec via sqlite3_auto_extension, not runtime file
    loading — confirmed in the vec0-poc spike). Connection::open_in_memory
    + execute_batch(schema) smoke-verified in the same spike.
    uuid = "1" (features = ["v4"]) also added per D-wq-1-3.

# ──────────────────────────────────────────────────────────────────────
# Sprint-close acceptance
# ──────────────────────────────────────────────────────────────────────
sprint_close_acceptance:
  description: |
    wq-core has no CLI/binary yet — acceptance is library-level only.
    wq-core is NOT exclusion-listed in this phase (no mq-embed dependency
    yet), so it participates in the normal workspace build/test/lint.
  commands: |
    $ cd /Users/develop/local-stacks/percept
    $ cargo fmt --all -- --check
    $ cargo clippy --workspace --exclude mq-embed --exclude mq-store --exclude mq-cli -- -D warnings
    $ cargo test -p wq-core --quiet
    $ cargo build --workspace --exclude mq-embed --exclude mq-store --exclude mq-cli
  verdict_logic: |
    All commands must exit 0. wq-core deliberately participates in the
    default exclude list's *complement* here (it is built and tested, not
    excluded) — this changes in wq-2 once mq-embed lands as a dependency.
  notes: |
    Do not add wq-core to the --exclude flags in this phase. Adding it here
    would be premature — the whole point of D-wq-1-5 and this phase's scope
    boundary is that wq-core has zero ONNX/mq-embed surface until wq-2.
