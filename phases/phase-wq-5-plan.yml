  - id: FU-wq-5-1
    title: "Wire wq-mcp into at least one real agent harness's MCP config and dogfood cross-harness continuity end-to-end"
    rationale: >
      This phase ships the server binary; actually adding it to (for
      example) this workspace's VS Code MCP config and confirming a
      ticket created via Claude Code is visible via Copilot Chat's wq
      tools is the real proof of ADR-038's central claim. Worth a
      dedicated dogfood sprint after wq-5 ships, not bundled into it.
    blocking_for: "validating ADR-038's core thesis in practice"
  - id: FU-wq-5-2
    title: "Revisit percept's CONTRIBUTING.md framing now that wq-core + mq-store both own local state (ADR-038 Consequences)"
    rationale: >
      ADR-038 explicitly flags this: 'worth revisiting percept's
      CONTRIBUTING.md framing once this ships.' Documentation-only
      follow-up, not a code sprint.
    blocking_for: "nothing — documentation accuracy only"

