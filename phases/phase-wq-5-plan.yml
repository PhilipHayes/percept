# ──────────────────────────────────────────────────────────────────────
# Sprint-close acceptance
# ──────────────────────────────────────────────────────────────────────
sprint_close_acceptance:
  description: |
    wq-mcp joins wq-core and wq-cli in the exclusion list — the wq family
    is now fully excluded from default build/test/lint, matching
    mq-{embed,store,cli}'s existing shape. This is the final phase of the
    initial wq build (phases wq-1 through wq-5).
  commands: |
    $ cd /Users/develop/local-stacks/percept
    $ cargo fmt --all -- --check
    $ cargo clippy -p wq-core -p wq-cli -p wq-mcp -- -D warnings
    $ cargo test -p wq-core -p wq-cli -p wq-mcp --quiet
    $ cargo clippy --workspace --exclude mq-embed --exclude mq-store --exclude mq-cli --exclude wq-core --exclude wq-cli --exclude wq-mcp -- -D warnings
    $ cargo build --workspace --exclude mq-embed --exclude mq-store --exclude mq-cli --exclude wq-core --exclude wq-cli --exclude wq-mcp
  verdict_logic: |
    All commands must exit 0. At this point the default workspace build/
    test/lint excludes exactly 6 crates (mq-embed, mq-store, mq-cli,
    wq-core, wq-cli, wq-mcp) — confirm .github/workflows/ci.yml's three
    cargo invocations all carry the full 6-crate exclude list consistently
    (a partial list in even one of the three commands reproduces the same
    "confusing unrelated CI failure" risk flagged in phase wq-2's notes).
  notes: |
    This sprint-close also closes out the wq-1..wq-5 initial build per
    ADR-038. FU-wq-2-1 (mq-store -> vec0 migration) remains unscheduled
    and is NOT a gate for calling this phase — or the wq family overall —
    complete-clean.
